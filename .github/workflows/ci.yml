name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race ./...

      - name: Build
        run: go build ./...

  # The Android shell is a separate toolchain that nothing else compiles, so
  # without this a change that stops building would only surface whenever
  # somebody next opened Android Studio.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # platform-tools only. The action's default also asks for the legacy
      # "tools" package, which newer command-line tools no longer list: once the
      # runner image moved on, the action downloaded them and failed before a
      # line of the app was built. The build needs neither — Gradle fetches the
      # platform and build tools it wants, with the licences accepted above.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # No gradle-version here: the committed wrapper pins it, so CI and a
      # developer's machine cannot drift onto different Gradle versions. That
      # matters — AGP 8.13 does not run on Gradle 9.6+.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # assembleRelease covers what assembleDebug does not: R8 shrinking and
      # lintVitalRelease, which is where a broken shell would otherwise only
      # surface at Play upload time.
      - name: Assemble and lint
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease lintDebug --no-daemon
